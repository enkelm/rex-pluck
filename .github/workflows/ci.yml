name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  config-and-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development tools
        run: brew install luajit shellcheck
      - run: sh scripts/check.sh
      - run: sh scripts/test.sh --unit
# Real Rex/PTY integration runs locally on provisioned hosts; see VALIDATION.md.
